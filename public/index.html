<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Activate Your Developer Badge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Discord embed meta tags -->
  <meta property="og:title" content="Start Your Discord Bot Instantly!" />
  <meta property="og:description" content="Paste your bot token and activate the Developer Badge." />
  <meta property="og:image" content="https://yourdomain.com/assets/bot-thumbnail.png" /> <!-- Replace with your image -->
  <meta property="og:url" content="https://yourdomain.com" />
  <meta name="theme-color" content="#5865F2" />

  <style>
    /* Background & stars from (1) */
    body {
      margin: 0;
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
      background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #000000 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      user-select: none;
      position: relative;
    }

    a {
      color: #00ffff;
      text-shadow: 0 0 6px #00ffff;
    }

    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
      background-size: contain;
      z-index: 0;
      animation: starScroll 500s linear infinite;
    }

    @keyframes starScroll {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 0 10000px;
      }
    }

    .container {
      z-index: 1;
      background: rgba(20, 20, 40, 0.85);
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow:
        0 8px 32px rgba(173, 216, 230, 0.15),
        0 1.5px 8px rgba(138, 43, 226, 0.1);
      max-width: 500px;
      width: 100%;
      animation: fadeIn 1.4s ease-out;
      backdrop-filter: blur(8px);
      position: relative;
      transition: transform 0.25s cubic-bezier(.4, 0, .2, 1),
        box-shadow 0.25s cubic-bezier(.4, 0, .2, 1);
      text-align: center;
      user-select: text;
    }

    .container:hover,
    .container:focus-within {
      transform: translateY(-12px) scale(1.015);
      box-shadow:
        0 16px 48px rgba(173, 216, 230, 0.3),
        0 4px 24px rgba(138, 43, 226, 0.15);
    }

    h1 {
      font-size: 2.2rem;
      color: #82b1ff;
      margin-bottom: 24px;
      text-shadow: 0 0 12px #1e88e580;
      user-select: text;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      user-select: text;
    }

    input {
      padding: 12px 16px;
      width: 100%;
      max-width: 420px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 1rem;
      font-family: inherit;
      background: rgba(255 255 255 / 0.1);
      color: white;
      transition: background-color 0.3s ease;
    }

    input::placeholder {
      color: #bbb;
      font-style: italic;
    }

    input:focus {
      background: rgba(255 255 255 / 0.2);
      box-shadow: 0 0 10px #5865F2;
    }

    button {
      background: linear-gradient(120deg, #00bcd4, #3f51b5, #7e57c2);
      background-size: 300% 300%;
      background-position: left center;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 14px 36px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 188, 212, 0.6);
      transition: transform 0.3s ease,
        box-shadow 0.3s ease,
        background-position 0.6s ease-in-out;
      user-select: none;
      width: 100%;
      max-width: 420px;
    }

    button:hover,
    button:focus {
      background-position: right center;
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 0 24px rgba(0, 188, 212, 0.9);
      outline: none;
    }

    #status {
      margin-top: 24px;
      font-size: 1rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 14px 24px;
      border-radius: 14px;
      white-space: pre-wrap;
      max-height: 220px;
      overflow-y: auto;
      color: #00ffab;
      user-select: text;
      font-family: Consolas, monospace, monospace;
      text-align: left;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      background: rgba(50, 98, 194, 0.85);
      color: white;
      font-size: 0.95rem;
      padding: 12px 0;
      z-index: 10;
      backdrop-filter: blur(6px);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="stars"></div>

  <main class="container" tabindex="0" role="main" aria-label="Activate Developer Badge form">
    <h1>Get Your Developer Badge</h1>

    <form onsubmit="start(event)" novalidate>
      <input
        id="token"
        type="text"
        placeholder="Paste your bot token here..."
        aria-label="Discord Bot Token"
        required
        autocomplete="off"
        spellcheck="false"
      />
      <button type="submit" aria-live="polite" aria-busy="false">🚀 Start Bot</button>
    </form>

    <div id="status" aria-live="polite" aria-atomic="true" role="status"></div>
  </main>

  <footer style="text-align: center; background-color: rgba(0, 0, 0, 0.3); color: white; padding: 1rem;">
    © 2025 <a href="https://github.com/IntellsGamer/">IntellsGamer</a>. All rights reserved.
  </footer>

  <script>
    async function start(e) {
      e.preventDefault();
      const token = document.getElementById('token').value.trim();
      const status = document.getElementById('status');
      const button = e.target.querySelector('button');
      if (!token) {
        status.innerText = "⚠️ Please enter your bot token.";
        return;
      }

      button.disabled = true;
      button.setAttribute('aria-busy', 'true');

      status.style.color = '#00ffab';
      status.innerHTML = "
        ⌛ Bot is running, please wait...<br>💡 To use it, run the command in Discord:<br><code>/active</code><br>⚠️ You might have to wait a little and refresh Discord to see the command.
      ";

      try {
        const res = await fetch(`/api/start?token=${encodeURIComponent(token)}`);
        const text = await res.text();

        if (res.ok) {
          status.style.color = '#00ffab';
          status.textContent = text;
        } else {
          status.style.color = '#ff6f6f';
          status.textContent = `❌ ${text}`;
        }
      } catch (err) {
        status.style.color = '#ff6f6f';
        status.textContent = '❌ Failed to start bot. See console for details.';
        console.error(err);
      } finally {
        button.disabled = false;
        button.setAttribute('aria-busy', 'false');
      }
    }
  </script>
</body>

</html>
